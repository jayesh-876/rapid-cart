version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - rapidcart-net

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - rapidcart-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Runs once on startup: deletes stale topics so old poison-pill messages
  # (written with the broken JsonSerializer) don't block the new consumers.
  kafka-setup:
    image: confluentinc/cp-kafka:7.2.1
    container_name: kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - rapidcart-net
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Deleting and recreating all rapidcart topics...'
      for topic in order-created inventory-reserved inventory-failed payment-completed payment-failed order-completed release-inventory; do
        kafka-topics --bootstrap-server kafka:9092 --delete --topic $$topic 2>/dev/null || true
        kafka-topics --bootstrap-server kafka:9092 --create --topic $$topic --partitions 1 --replication-factor 1
        echo \"Topic ready: $$topic\"
      done
      echo 'All topics ready.'
      "
    restart: "no"

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rapidcart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rapidcart-net

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - rapidcart-net

  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rapidcart
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8081:8081"
    networks:
      - rapidcart-net

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rapidcart
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8082:8082"
    networks:
      - rapidcart-net

  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rapidcart
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8083:8083"
    networks:
      - rapidcart-net

  notification-service:
    build: ./notification-service
    container_name: notification-service
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8084:8084"
    networks:
      - rapidcart-net

volumes:
  pgdata:

networks:
  rapidcart-net:
    driver: bridge
